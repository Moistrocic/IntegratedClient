name: Release Assets

# Flow:
#   1. git tag build-1.5 && git push origin build-1.5
#   2. Actions builds and creates a DRAFT release (github-actions[bot])
#   3. Review the draft, then Publish it manually when ready
#   4. Edit the draft: change tag to v2.2, set title/notes, then Publish
#
# Build tags use build-* so retargeting the draft to a final v* tag does NOT
# start a second workflow. No gate job / concurrency (those queued behind stuck
# GitHub hosted-runner failures).
on:
  # TEMP(quota): push trigger disabled while GitHub Actions quota is exceeded; revert this commit to re-enable.
  push:
    # TEMP(quota): tag pushes ignore path filters, so use a never-matching tag pattern
    # instead of paths-ignore. Revert this commit to re-enable release builds.
    tags:
      - "ci-paused-never-match"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish assets for (for example, build-1.5 or v1.0.0)"
        required: true
      release_name:
        description: "Release name used when creating or updating a release manually"
        required: true
      body:
        description: "Optional release notes for manual publishing"
        required: false

permissions:
  contents: write

env:
  CLIENT_NAME: IntegratedClient

jobs:
  build-cmake:
    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HTTP_MULTIPLEXING: false
      # Exposed at job level so steps can read the cert without re-resolving secrets.
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: linux
          os: ubuntu-24.04
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DDISCORD_DYNAMIC=ON -DVULKAN=ON
          cmake-init-env: CXXFLAGS="-Werror -Wno-unused-function"
          package-file: "*-linux_x86_64.tar.xz"
          artifact-name: release-linux
          asset-name: IntegratedClient-linux.tar.xz
        - name: windows
          os: windows-latest
          cmake-args: -A x64 -DTOOLS=OFF -DDOWNLOAD_GTEST=OFF -DVULKAN=ON
          cmake-init-env: CXXFLAGS= LDFLAGS=
          package-file: "*-win64.zip"
          artifact-name: release-windows
          asset-name: IntegratedClient-windows.zip
        - name: macos
          os: macOS-latest
          # Universal PCH builds split architectures and reject the shared ARM compiler flags.
          cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release -DPREFER_BUNDLED_LIBS=ON -DPRECOMPILE_HEADERS=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_SYSTEM_IGNORE_PATH=/usr/lib -DCMAKE_FIND_FRAMEWORK=LAST
          cmake-init-env: CXXFLAGS=
          package-file: "*-macos.dmg"
          artifact-name: release-macos
          asset-name: IntegratedClient-macos.dmg

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    - name: Init ddnet-libs submodule
      run: git submodule update --init --recursive ddnet-libs

    - name: Prepare Linux
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update -y
        sudo apt-get install pkg-config ninja-build libcurl4-openssl-dev libdbus-1-dev libfreetype6-dev libnotify-dev libogg-dev libopus-dev libopusfile-dev libsdl2-dev libsqlite3-dev libpng-dev libvulkan-dev libglew-dev -y

    - name: Prepare macOS
      if: contains(matrix.os, 'macOS')
      run: |
        brew update
        brew install pkg-config ninja molten-vk vulkan-headers glslang spirv-tools glew libpng opusfile wavpack x264
        brew upgrade freetype
        pip3 install --break-system-packages dmgbuild pyobjc-framework-Quartz
        echo /Library/Frameworks/Python.framework/Versions/3.12/bin >> "$GITHUB_PATH"
        python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))' >> "$GITHUB_PATH"
        sudo rm -rf /Library/Developer/CommandLineTools

    - name: Add Rust macOS targets
      if: contains(matrix.os, 'macOS')
      run: |
        rustup default stable
        rustup update
        rustup target add x86_64-apple-darwin aarch64-apple-darwin

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          ./

    - name: Build release binaries
      env:
        OFFICIAL_CODE: ${{ secrets.BESTCLIENT_OFFICIAL_CODE }}
      shell: bash
      run: |
        OFFICIAL_HEADER="$GITHUB_WORKSPACE/versioninfo.h"
        if [ -z "$OFFICIAL_CODE" ]; then
          echo "secrets.BESTCLIENT_OFFICIAL_CODE is required for official release builds" >&2
          exit 1
        fi
        python3 - <<'PY'
        import os
        from pathlib import Path
        code = os.environ["OFFICIAL_CODE"]
        if any(ch in code for ch in ('\0', '\n', '\r', '"', '\\')):
            raise SystemExit("BESTCLIENT_OFFICIAL_CODE must not contain quotes, backslashes, or newlines")
        path = Path(os.environ["GITHUB_WORKSPACE"]) / "versioninfo.h"
        path.write_text(f'#define BESTCLIENT_OFFICIAL_CODE "{code}"\n', encoding="utf-8")
        PY
        if [[ "${{ matrix.os }}" == windows-latest ]]; then
          export MSYS_ARG_CONV_EXCL="/FI"
          cmake -S . -B build-release ${{ matrix.cmake-args }} -DCMAKE_CXX_FLAGS="/FI$OFFICIAL_HEADER"
        elif [[ "${{ matrix.os }}" == "macOS-latest" ]]; then
          cmake -E env CXXFLAGS="-include$OFFICIAL_HEADER" \
            cmake -S . -B build-release ${{ matrix.cmake-args }} \
            -DPNG_LIBRARY="${GITHUB_WORKSPACE}/ddnet-libs/png/mac/libfat/libpng16.16.dylib" \
            -DPNG_INCLUDEDIR="${GITHUB_WORKSPACE}/ddnet-libs/png/include"
        else
          cmake -E env CXXFLAGS="-include$OFFICIAL_HEADER" \
            cmake -S . -B build-release ${{ matrix.cmake-args }}
        fi
        cmake --build build-release --config Release --target game-client
        if [[ "${{ matrix.os }}" == windows-latest ]]; then
          # Auto-updater must be part of the Windows release package.
          cmake --build build-release --config Release --target integratedclient-updater
        fi

    # Sign when secrets are present. Without a cert the build still ships unsigned —
    # Defender may false-positive until WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD are set.
    - name: Sign Windows binaries
      if: contains(matrix.os, 'windows') && env.WINDOWS_CERT_BASE64 != ''
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: pwsh
      run: |
        if([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
          throw "WINDOWS_CERT_PASSWORD secret is required when WINDOWS_CERT_BASE64 is set."
        }
        $CertPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
        [IO.File]::WriteAllBytes($CertPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
        $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
          Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
        if(-not $SignTool) { throw "signtool.exe not found" }
        # Multi-config MSVC builds put binaries under a per-config subdirectory, so locate
        # them instead of hardcoding the layout. The updater is shipped in the same zip and
        # must be signed too, otherwise Windows SmartScreen/Defender treat the update package
        # as unsigned even though the main client is signed.
        $Targets = @("DDNet.exe", "integratedclient-updater.exe") | ForEach-Object {
          Get-ChildItem -Path build-release -Filter $_ -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
        } | Where-Object { $_ }
        if($Targets.Count -ne 2) { throw "expected 2 binaries to sign, found $($Targets.Count)" }
        foreach($Target in $Targets) {
          & $SignTool sign /f $CertPath /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v $Target
          if($LASTEXITCODE -ne 0) { throw "signing failed for $Target" }
        }
        Remove-Item $CertPath -Force

    - name: Package release build
      run: |
        cmake --build build-release --config Release --target package_default
        mkdir artifacts
        mv build-release/${{ matrix.package-file }} artifacts/${{ matrix.asset-name }}

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: artifacts/${{ matrix.asset-name }}

  publish:
    name: Publish Release Assets
    needs:
      - build-cmake
    runs-on: ubuntu-latest
    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: List downloaded release packages
      run: ls -R artifacts

    # Keep the draft manual so nothing is published without review.
    # Creating via GITHUB_TOKEN attributes the release to github-actions[bot].
    - name: Create draft GitHub release from tag
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: true
        generate_release_notes: true
        files: |
          artifacts/${{ env.CLIENT_NAME }}-linux.tar.xz
          artifacts/${{ env.CLIENT_NAME }}-windows.zip
          artifacts/${{ env.CLIENT_NAME }}-macos.dmg

    - name: Create or update release manually
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: ${{ github.event.inputs.release_name }}
        body: ${{ github.event.inputs.body }}
        draft: true
        files: |
          artifacts/${{ env.CLIENT_NAME }}-linux.tar.xz
          artifacts/${{ env.CLIENT_NAME }}-windows.zip
          artifacts/${{ env.CLIENT_NAME }}-macos.dmg

    # IntegratedClient auto-update deployment template.
    # Required repository secrets (never commit credentials):
    #   UPDATE_SSH_HOST     static server host
    #   UPDATE_SSH_USER     SSH user
    #   UPDATE_SSH_KEY      private SSH key (PEM/OpenSSH), no passphrase
    #   UPDATE_SSH_PORT     optional SSH port, defaults to 22
    #   UPDATE_SSH_PATH     optional remote directory, defaults to
    #                       /var/www/update.moiservice.top/IntegratedClient
    # The updater checks https://update.moiservice.top/IntegratedClient/update.json.
    - name: Checkout version metadata for updater deploy
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: actions/checkout@v4
      with:
        sparse-checkout: src/game/version.h

    - name: Upload update assets and update.json to static server
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        UPDATE_SSH_HOST: ${{ secrets.UPDATE_SSH_HOST }}
        UPDATE_SSH_USER: ${{ secrets.UPDATE_SSH_USER }}
        UPDATE_SSH_KEY: ${{ secrets.UPDATE_SSH_KEY }}
        UPDATE_SSH_PORT: ${{ secrets.UPDATE_SSH_PORT }}
        UPDATE_SSH_PATH: ${{ secrets.UPDATE_SSH_PATH }}
      run: |
        set -euo pipefail
        if [[ -z "${UPDATE_SSH_HOST:-}" || -z "${UPDATE_SSH_USER:-}" || -z "${UPDATE_SSH_KEY:-}" ]]; then
          echo "Update deploy secrets are not configured; skipping static-server upload." >&2
          exit 0
        fi
        VERSION=$(awk -F'"' '/^#define INTEGRATEDCLIENT_VERSION / {print $2}' src/game/version.h)
        if [[ -z "$VERSION" ]]; then
          echo "Could not parse INTEGRATEDCLIENT_VERSION" >&2
          exit 1
        fi
        ASSET_NAME="IntegratedClient-windows.zip"
        ASSET_URL="https://update.moiservice.top/IntegratedClient/${ASSET_NAME}"
        SHA256=$(sha256sum "artifacts/${ASSET_NAME}" | awk '{print $1}')
        REMOTE_PATH="${UPDATE_SSH_PATH:-/var/www/update.moiservice.top/IntegratedClient}"
        SSH_PORT="${UPDATE_SSH_PORT:-22}"

        umask 077
        printf '%s\n' "$UPDATE_SSH_KEY" > "$RUNNER_TEMP/update_deploy_key"
        chmod 600 "$RUNNER_TEMP/update_deploy_key"
        mkdir -p "$RUNNER_TEMP/update_deploy"
        cp "artifacts/${ASSET_NAME}" "$RUNNER_TEMP/update_deploy/${ASSET_NAME}"
        cat > "$RUNNER_TEMP/update_deploy/update.json" <<EOF
        {
          "version": "${VERSION}",
          "asset_name": "${ASSET_NAME}",
          "asset_url": "${ASSET_URL}",
          "sha256": "${SHA256}"
        }
        EOF
        printf '%s\n' "$VERSION" > "$RUNNER_TEMP/update_deploy/version.txt"

        SSH_OPTS=(-i "$RUNNER_TEMP/update_deploy_key" -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new)
        ssh "${SSH_OPTS[@]}" "$UPDATE_SSH_USER@$UPDATE_SSH_HOST" "mkdir -p '$REMOTE_PATH'"
        scp -P "$SSH_PORT" -i "$RUNNER_TEMP/update_deploy_key" -o StrictHostKeyChecking=accept-new \
          "$RUNNER_TEMP/update_deploy/${ASSET_NAME}" \
          "$RUNNER_TEMP/update_deploy/update.json" \
          "$RUNNER_TEMP/update_deploy/version.txt" \
          "$UPDATE_SSH_USER@$UPDATE_SSH_HOST:$REMOTE_PATH/"
