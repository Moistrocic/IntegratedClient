name: Check clang-tidy

on:
  # TEMP(quota): push trigger disabled while GitHub Actions quota is exceeded; revert this commit to re-enable.
  push:
    # TEMP(quota): push trigger disabled while GitHub Actions quota is exceeded.
    # Revert this commit to re-enable CI on push.
    paths-ignore:
      - '**'
    branches-ignore:
      - gh-readonly-queue/**
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check-clang-tidy:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: false

    - name: Init ddnet-libs submodule
      run: git submodule update --init --recursive ddnet-libs

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install \
          clang-20 \
          clang-tidy-20 \
          cmake \
          libavcodec-dev \
          libavformat-dev \
          libavutil-dev \
          libfreetype6-dev \
          libglew-dev \
          libmariadb-dev \
          libminiupnpc-dev \
          libnotify-dev \
          libsdl2-dev \
          libsqlite3-dev \
          libswresample-dev \
          libswscale-dev \
          libwebsockets-dev \
          libx264-dev \
          lld-20 \
          ninja-build \
          pkg-config \
          -y

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
          workspaces: |
              src/mastersrv
              src/masterping
              ./

    - name: Build with clang-tidy
      run: |
        clang-tidy-20 --version
        mkdir clang-tidy
        cd clang-tidy
        TIDY_FLAGS="-Werror"
        export CXXFLAGS="$TIDY_FLAGS"
        cmake -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++-20 \
          -DCMAKE_C_COMPILER=clang-20 \
          -DCMAKE_CXX_CLANG_TIDY="clang-tidy-20;-warnings-as-errors=*" \
          -DCMAKE_C_CLANG_TIDY="clang-tidy-20;-warnings-as-errors=*" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DANTIBOT=ON \
          -DDISCORD=ON \
          -DDOWNLOAD_GTEST=ON \
          -DMYSQL=ON \
          -DSTEAM=ON \
          -DUPNP=ON \
          -DVIDEORECORDER=ON \
          -DVULKAN=ON \
          -DWEBSOCKETS=ON \
          -Werror=dev ..
        cmake --build . --config Debug --target everything testrunner -- -k 0
